<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>银行卡管理</title>
    <style>
      /* 防首帧白闪：与 style.css 的 --theme-bg-secondary 默认值一致 */
      html,
      body {
        margin: 0;
        padding: 0;
        /* ⚠ 2026-10-11 定案：这条 height:100% 链在 Android WebView 里**不可信** ——
           loadUrl 早于 WebView 首次 layout 时，Chromium 按 0 高视口做首次布局，
           整条链解析成 0px 且之后不重解析（探针 chain= 实测 #app/BODY/HTML 全 css=0px），
           顶栏/列表全部 0 高被裁，屏幕上只剩 position:fixed 的「+添加卡片」。
           真正的修复在 CardOffline.vue：根容器 position:fixed;inset:0 锚定视口
           （fixed 包含块是视口，与百分比链解耦）；外加 CardWebScreen.kt 把 loadUrl
           推迟到 doOnLayout 之后。下面这层百分比链只作桌面浏览器渐进增强，勿再依赖。 */
        height: 100%;
        background: var(--theme-bg-secondary, #ffffff);
        overscroll-behavior: none;
      }
      #app {
        height: 100%;
      }
      /* WebView 在原生推数据前显示的兜底；Vue 挂载后会被接管 */
      #boot-hint {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 14px/1.6 -apple-system, "PingFang SC", sans-serif;
        color: var(--theme-text-secondary, #969799);
      }
    </style>
    <script defer src="./card.js"></script>
    <link rel="stylesheet" href="./card.css">
      <script>window.__CARD_PAGE_HTML_VER__='2026-10-18 02:44:06'</script>
  </head>
  <body>
    <div id="app"><div id="boot-hint">加载中…</div></div>
  </body>
</html>
