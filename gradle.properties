org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 站点品牌信息（等价 web/.env 的 VITE_BRAND_NAME / VITE_POWERED_BY / VITE_COPYRIGHT_START）。
# 登录页页脚（非演示模式）显示，改这里即可换品牌。备案号（ICP / 公安）安卓端不显示，已删除。
SITE_BRAND_NAME=Gold 财管
SITE_POWERED_BY=BigJiHua
SITE_COPYRIGHT_START=2026

# 公网部署安全项（安全整改 P0-4，2026-10-08）
#
# 🚫 2026-10-17 起 **不在这里配置任何站点地址**：
#   本 APP 采用「用户自带后端」——API 地址与分享 URL 由用户在登录页「接入站点」里输入，
#   持久化到本机（SiteStore），APK 内不带任何默认/占位地址。
#   因此 API_BASE_URL / SITE_URL 已彻底移除，不要再加回来（否则会被打进分发包）。
#
# API_HOST     —— 证书对应的域名（用于 Pinning；留空则不做域名锁定）
#                   例：api.example.com
#
# API_PINNED_SHA256 可选：证书指纹（sha256/AAAA...）。
#   用 Let's Encrypt 请留空！它的证书约 90 天轮换，硬编码指纹会导致
#   证书更新后 APP 全面失效且必须发版。仅在用自签名/固定 CA 证书时才填。
#   获取方式：
#     openssl s_client -connect api.example.com:443 -servername api.example.com \
#       </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256
# 联调期间留空（仅 Pinning 用，未启用时无作用；构建警告属预期）
API_HOST=
API_PINNED_SHA256=

# 发布签名（安全整改 P2-13，2026-10-08）
#   以下为空时 release 构建为未签名（可调试安装，但不能上架/分发）。
#   首次配置：
#     1) 生成密钥库（口令自己定，不要用示例值）：
#        keytool -genkeypair -v -keystore APP/release.jks -alias live \
#                -keyalg RSA -keysize 2048 -validity 10000
#     2) 把路径与口令填到下面；或更好地配到环境变量 /
#        ~/.gradle/gradle.properties（本机生效、不入库）。
#   gradle.properties 本身通常会入库，口令不应明文写在这里。
RELEASE_KEYSTORE=
RELEASE_STORE_PASSWORD=
RELEASE_KEY_ALIAS=live
RELEASE_KEY_PASSWORD=